<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Mawaru app icon: a device turning inside an orbit (回る, "to turn"). macOS grid: 824 px tile, 100 px margin. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c37"/>
      <stop offset="1" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa4ff"/>
      <stop offset=".55" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8a5bff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dbe3"/>
      <stop offset=".5" stop-color="#f4f5f8"/>
      <stop offset="1" stop-color="#b9bcc7"/>
    </linearGradient>
    <linearGradient id="orbit" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7aa4ff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="phoneShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="10" dy="26" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="tileClip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)"/>
  <g clip-path="url(#tileClip)">
    <ellipse cx="512" cy="560" rx="250" ry="250" fill="#5b8cff" opacity=".22" filter="url(#glow)"/>

    <!-- one orbit (ellipse centred at 512,540, tilted -18°): its top half passes behind the device -->
    <path d="M 212 540 A 300 105 0 0 1 812 540" fill="none" stroke="#5b8cff" stroke-opacity=".38" stroke-width="22" stroke-linecap="butt" transform="rotate(-18 512 540)"/>

    <!-- device, turned a little -->
    <g transform="rotate(-14 512 512)" filter="url(#phoneShadow)">
      <rect x="384" y="236" width="256" height="552" rx="58" fill="url(#body)"/>
      <rect x="400" y="252" width="224" height="520" rx="44" fill="#0d0e12"/>
      <rect x="410" y="262" width="204" height="500" rx="36" fill="url(#screen)"/>
      <rect x="476" y="280" width="72" height="22" rx="11" fill="#0d0e12"/>
      <path d="M 410 520 L 614 400 L 614 470 L 410 590 Z" fill="#fff" opacity=".12"/>
    </g>

    <!-- …and its bottom half in front of it, ending in an arrow (turning clockwise) -->
    <g transform="rotate(-18 512 540)">
      <path d="M 812 540 A 300 105 0 0 1 236 572" fill="none" stroke="url(#orbit)" stroke-width="22" stroke-linecap="butt"/>
      <path d="M 186 534 L 264 556 L 218 614 Z" fill="#7aa4ff" stroke="#7aa4ff" stroke-width="12" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
